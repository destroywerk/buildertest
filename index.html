        <main class="main-content">
            <div class="content-scrollable-area">
                 <div class="page-title">Select recipients</div> 
                 
                 <div class="people-selector-container"> 
                     <div class="main-content-area">
                         <!-- Left Column Content -->
                         <div class="search-header">
                             <div>
                                <div class="search-title">Select members</div>
                                <div class="search-subtitle">All selected items will be included in the group and automatically updated</div>
                             </div>
                             <div class="search-menu-wrapper">
                                <button id="search-menu-btn" class="menu-btn" aria-label="Options menu">
                                    <!-- Placeholder for 3-dot icon -->
                                    &vellip;
                                </button>
                                <div id="search-options-dropdown" class="search-options-dropdown" style="display: none;">
                                    <button data-action="add-condition">
                                        <span class="menu-icon"><!-- Add Icon --></span> Add people using conditions
                                    </button>
                                     <button data-action="delete-all">
                                        <span class="menu-icon"><!-- Delete Icon --></span> Delete all members
                                     </button>
                                 </div>
                             </div>
                         </div>

                         <div class="search-selections-section">
                            <!-- Search input and selected items -->
                            <div class="search-input-wrapper">
                                 <span class="search-icon">🔍</span> <!-- Placeholder Icon -->
                                <input type="text" placeholder="Add people, departments, teams, workplaces etc." id="main-search"/>
                                <div id="search-results-dropdown" class="search-results-dropdown" style="display: none;">
                                    <!-- Search results populated by JS -->
                                </div>
                            </div>
                            <div class="selected-items-wrapper" id="selected-items">
                                <!-- Selected items populated by JS -->
                                 <span class="placeholder-text">No items selected</span>
                            </div>
                         </div>
    
                         <div class="conditions-section" id="conditions-section" style="display: none;"> <!-- Hidden by default -->
                            <!-- Conditions populated by JS -->
                            <div id="conditions-list">
                               <span class="placeholder-text">No conditions defined</span>
                            </div>
                            <button id="add-condition-btn">+ Add Condition</button>
                        </div>
    
                         <div class="exclusions-section" id="exclusions-section">
                            <div class="exclusion-search-wrapper">
                                <span class="search-icon">🔍</span> <!-- Placeholder Icon -->
                                <input type="text" placeholder="Select people to exclude" id="exclusion-search"/>
                                <div id="exclusion-results-dropdown" class="search-results-dropdown" style="display: none;">
                                    <!-- Exclusion search results populated by JS -->
                                </div>
                                <!-- Tokens will be added here dynamically by JS later -->
                            </div>
                            <div id="excluded-items-list" class="excluded-items-wrapper" style="display:none;"> 
                                <!-- Area for token display if not inside input -->
                            </div>
                         </div>
    
                         <div class="toggles-section" id="toggles-section">
                             <!-- Toggles will be styled as switches -->
                             <label class="toggle-switch">
                                 <input type="checkbox" id="toggle-hire-date"> 
                                 <span class="slider"></span>
                                 Exclude people with hire date within <input type="number" value="6" class="toggle-value-input"> months
                             </label>
                              <label class="toggle-switch">
                                 <input type="checkbox" id="toggle-external"> 
                                 <span class="slider"></span>
                                 Exclude external employees
                             </label>
                             <label class="toggle-switch">
                                 <input type="checkbox" id="toggle-leave"> 
                                 <span class="slider"></span>
                                  Exclude employees on leave
                             </label>
                              <label class="toggle-switch">
                                 <input type="checkbox" id="toggle-only-status"> 
                                 <span class="slider"></span>
                                  Only include people with status 
                                  <select id="status-filter-select"><option>Onboarding</option></select> <!-- Placeholder -->
                             </label>
                         </div>
                     </div>

                     <div class="member-list-area">
                         <!-- Right Column Content: Tabs + Table -->
                         <div class="tabs-section">
                             <button class="tab-button active" data-tab="members">Members</button>
                             <button class="tab-button" data-tab="excluded">Excluded</button>
                             <button class="tab-button" data-tab="all">All</button>
                             <span id="member-count-display" class="member-count-display"></span>
                         </div>
    
                         <div class="member-table-section" id="member-table-section">
                             <table id="member-table">
                                 <thead>
                                     <tr>
                                         <th>Name</th>
                                         <!-- <th>Position</th> -->
                                         <!-- <th>Status</th> -->
                                         <!-- <th>Department</th> -->
                                         <!-- <th>Workplace</th> -->
                                         <th class="action-header">Action</th>
                                     </tr>
                                 </thead>
                                 <tbody id="member-table-body">
                                     <!-- Table rows populated by JS -->
                                     <!-- EMPTY STATE WILL BE HANDLED BY JS -->
                                 </tbody>
                             </table>
                             <div id="member-table-empty-state" style="display: none;" class="empty-state-message">
                                 <div class="empty-state-icon"> <!-- Placeholder --> </div>
                                 <div>No members yet</div>
                                 <div class="empty-state-subtitle">Search to add people, departments, workplaces, and more. <a href="#">Learn more</a>.</div>
                             </div>
                         </div>
                         
                     </div>
                </div> 
                 
                 <!-- Footer Buttons -->
                 <div class="page-footer">
                     <button class="btn btn-secondary">Cancel</button>
                     <button class="btn btn-primary">Save</button>
                 </div>
            </div>
        </main>
    </div>

    <!-- Hovercard Placeholder -->
    <div id="hovercard" class="hovercard" style="display: none; position: fixed; /* Use fixed for viewport positioning */ ">
        <!-- Content populated by JS -->
    </div>

    <script src="script.js"></script>
    <!-- Add Choices.js JS -->
    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
