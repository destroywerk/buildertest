        <main class="main-content">
            <div class="content-scrollable-area">
                 <!-- Main app content (PeopleSelectorContent) goes here -->
                 <!-- <h1>People Selector Content</h1> -->

                 <div class="people-selector-content">
                    <!-- Search and Selections Section -->
                    <div class="search-selections-section">
                        <div class="search-input-wrapper">
                            <!-- SearchDropdown equivalent goes here -->
                            <input type="text" placeholder="Search people, departments, positions..." id="main-search"/>
                            <div id="search-results-dropdown" class="search-results-dropdown" style="display: none;">
                                <!-- Search results populated by JS -->
                            </div>
                        </div>
                        <div class="selected-items-wrapper" id="selected-items">
                            <!-- Selected items populated by JS -->
                        </div>
                    </div>

                    <!-- Conditions Section -->
                    <div class="conditions-section" id="conditions-section">
                        <h2>Conditions</h2>
                        <div id="conditions-list">
                           <!-- Conditions populated by JS -->
                        </div>
                        <button id="add-condition-btn">+ Add Condition</button>
                    </div>

                    <!-- Exclusions Section -->
                     <div class="exclusions-section" id="exclusions-section">
                        <h2>Exclusions</h2>
                        <div class="exclusion-search-wrapper">
                            <input type="text" placeholder="Search people to exclude..." id="exclusion-search"/>
                            <div id="exclusion-results-dropdown" class="search-results-dropdown" style="display: none;">
                                <!-- Exclusion search results populated by JS -->
                            </div>
                        </div>
                         <div id="excluded-items-list" class="excluded-items-wrapper">
                            <!-- Excluded items populated by JS -->
                        </div>
                     </div>

                     <!-- Toggles Section -->
                     <div class="toggles-section" id="toggles-section">
                         <h2>Options</h2>
                         <!-- Toggles will be added here -->
                         <label><input type="checkbox" id="toggle-external"> Exclude external members</label>
                         <label><input type="checkbox" id="toggle-leave"> Exclude members on leave</label>
                         <!-- More toggles... -->
                     </div>

                     <!-- Tabs -->
                     <div class="tabs-section">
                         <button class="tab-button active" data-tab="members">Members</button>
                         <button class="tab-button" data-tab="excluded">Excluded</button>
                         <button class="tab-button" data-tab="all">All</button>
                     </div>

                     <!-- Member Table Section -->
                     <div class="member-table-section" id="member-table-section">
                         <table id="member-table">
                             <thead>
                                 <tr>
                                     <th>Name</th>
                                     <th>Position</th>
                                     <th>Status</th>
                                     <th>Department</th>
                                     <th>Workplace</th>
                                     <th>Action</th>
                                 </tr>
                             </thead>
                             <tbody id="member-table-body">
                                 <!-- Table rows populated by JS -->
                             </tbody>
                         </table>
                     </div>
                 </div>
            </div>
        </main>
    </div>

    </div>
